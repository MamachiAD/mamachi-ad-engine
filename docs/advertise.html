<!-- Section 2: Multi-Tier Geo-Targeting -->
<div class="space-y-4 pt-4 border-t border-slate-800">
    <h2 class="text-sm font-extrabold text-sky-400 uppercase tracking-widest flex items-center gap-2 border-b border-slate-800 pb-2">
        <i data-lucide="globe" class="w-4 h-4"></i> 2. Target Audience Reach & Geographic Scope
    </h2>
    
    <div>
        <label class="block text-xs font-bold text-slate-300 mb-1">Select Targeting Scope</label>
        <select id="target_scope" onchange="toggleGeoFields()" class="w-full px-4 py-3 rounded-xl bg-slate-950 border border-slate-800 text-white text-sm focus:border-sky-500 focus:outline-none transition-colors">
            <option value="worldwide">🌍 Worldwide / Global Reach</option>
            <option value="continental">🗺️ Continental Scope (e.g. North America, Europe, Africa)</option>
            <option value="country">🏳️ Country / National Level (e.g. USA, UK, Ethiopia, Germany)</option>
            <option value="regional">🏙️ Regional / State Level (e.g. California, Bavaria, East Coast)</option>
            <option value="hyperlocal">📍 Hyper-Local (Specific Cities & Neighborhoods)</option>
        </select>
    </div>

    <!-- Dynamic Location Entry Field -->
    <div id="geo_input_container">
        <label id="geo_label" class="block text-xs font-bold text-slate-300 mb-1">Target Locations (Comma Separated)</label>
        <input type="text" id="target_locations" class="w-full px-4 py-3 rounded-xl bg-slate-950 border border-slate-800 text-white text-sm focus:border-sky-500 focus:outline-none" placeholder="Global distribution across all active networks...">
    </div>
</div>

<script>
    function toggleGeoFields() {
        const scope = document.getElementById('target_scope').value;
        const input = document.getElementById('target_locations');
        const label = document.getElementById('geo_label');

        if (scope === 'worldwide') {
            label.innerText = 'Target Locations';
            input.value = 'Worldwide';
            input.placeholder = 'Global distribution across all networks...';
        } else if (scope === 'continental') {
            label.innerText = 'Target Continents (Comma Separated)';
            input.value = '';
            input.placeholder = 'e.g. North America, Europe, Asia, Africa';
        } else if (scope === 'country') {
            label.innerText = 'Target Countries (Comma Separated)';
            input.value = '';
            input.placeholder = 'e.g. United States, United Kingdom, Ethiopia, Canada';
        } else if (scope === 'regional') {
            label.innerText = 'Target Regions / States (Comma Separated)';
            input.value = '';
            input.placeholder = 'e.g. California, Texas, Greater London, Ontario';
        } else if (scope === 'hyperlocal') {
            label.innerText = 'Target Cities & Neighborhoods (Comma Separated)';
            input.value = '';
            input.placeholder = 'e.g. New York City, SoHo, 10001, Addis Ababa';
        }
    }
</script>
