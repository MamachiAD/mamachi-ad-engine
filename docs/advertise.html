<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Launch Your AI Ad Campaign - Mamachi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen py-10 px-4">
    <div class="max-w-3xl mx-auto space-y-8">
        <a href="index.html" class="inline-flex items-center gap-2 text-xs font-bold text-sky-400 hover:underline">
            <i data-lucide="arrow-left" class="w-4 h-4"></i> Back to Mamachi Feed
        </a>
        
        <div class="text-center space-y-2">
            <h1 class="text-3xl sm:text-4xl font-black text-white">Launch Your <span class="text-sky-400">AI Ad Campaign</span></h1>
            <p class="text-slate-400 text-xs sm:text-sm">Promote your book, digital product, or service across global channels.</p>
        </div>

        <form id="adForm" class="p-8 rounded-3xl bg-slate-900 border border-slate-800 shadow-2xl space-y-8">
            <!-- Section 1 -->
            <div class="space-y-4">
                <h2 class="text-sm font-extrabold text-sky-400 uppercase tracking-widest flex items-center gap-2">
                    <i data-lucide="user" class="w-4 h-4"></i> 1. Vendor & Product Information
                </h2>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-300 mb-1">Your Name / Company</label>
                        <input type="text" id="name" required class="w-full px-4 py-3 rounded-xl bg-slate-950 border border-slate-800 text-white text-sm focus:border-sky-500 focus:outline-none" placeholder="Acme Publishing">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-300 mb-1">Contact Email</label>
                        <input type="email" id="email" required class="w-full px-4 py-3 rounded-xl bg-slate-950 border border-slate-800 text-white text-sm focus:border-sky-500 focus:outline-none" placeholder="creator@acme.com">
                    </div>
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-300 mb-1">Product / Service Title</label>
                        <input type="text" id="title" required class="w-full px-4 py-3 rounded-xl bg-slate-950 border border-slate-800 text-white text-sm focus:border-sky-500 focus:outline-none" placeholder="The Future of Autonomous AI">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-300 mb-1">Destination Landing Page URL</label>
                        <input type="url" id="url" required class="w-full px-4 py-3 rounded-xl bg-slate-950 border border-slate-800 text-white text-sm focus:border-sky-500 focus:outline-none" placeholder="https://yourwebsite.com/offer">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-300 mb-1">Product Summary / Manuscript Snippet</label>
                    <textarea id="summary" rows="3" class="w-full px-4 py-3 rounded-xl bg-slate-950 border border-slate-800 text-white text-sm focus:border-sky-500 focus:outline-none" placeholder="Paste short summary or description..."></textarea>
                </div>
            </div>

            <!-- Section 4: Secure Checkout -->
            <div class="pt-6 border-t border-slate-800 space-y-4">
                <h2 class="text-sm font-extrabold text-sky-400 uppercase tracking-widest flex items-center gap-2">
                    <i data-lucide="credit-card" class="w-4 h-4"></i> 4. Secure Checkout & Activation
                </h2>
                <p class="text-xs text-slate-400">Complete payment to instantly verify compliance and activate your 24/7 automated omnichannel campaign.</p>
                
                <button type="submit" id="checkout-btn" class="w-full py-4 rounded-2xl bg-gradient-to-r from-sky-500 via-indigo-600 to-pink-500 hover:opacity-90 text-white font-black text-xs uppercase tracking-widest shadow-2xl transition-all active:scale-98 flex items-center justify-center gap-2">
                    <i data-lucide="zap" class="w-4 h-4"></i> Proceed to Secure Checkout & Launch ($3.00)
                </button>
            </div>
        </form>
    </div>
    <script>
        lucide.createIcons();
        document.getElementById('adForm').addEventListener('submit', function(e) {
            e.preventDefault();
            alert('Redirecting to secure PayPal checkout & activating campaign...');
            // Add your Supabase insert / PayPal webhook redirect logic here
        });
    </script>
</body>
</html>
