- name: Trigger GitHub Pages build and check live status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p docs/posts
          
          if gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/builds" >/tmp/build.txt 2>&1; then BUILD="requested OK"; else BUILD="FAILED: $(head -c 300 /tmp/build.txt)"; fi
          git fetch origin "$GITHUB_REF_NAME" -q 2>/dev/null || true
          
          # Find the newest HTML post file generated in docs/posts/
          LATEST_POST=$(ls -t docs/posts/*.html 2>/dev/null | head -n 1)
          if [ -n "$LATEST_POST" ]; then
            FILENAME=$(basename "$LATEST_POST")
            IFS='/' read -r OWNER REPO <<< "$GITHUB_REPOSITORY"
            URL="https://${OWNER,,}.github.io/${REPO}/posts/${FILENAME}"
          else
            IFS='/' read -r OWNER REPO <<< "$GITHUB_REPOSITORY"
            URL="https://${OWNER,,}.github.io/${REPO}/"
          fi

          {
            echo "### Pages diagnostics"
            echo '```'
            echo "docs/index.html status: \$([ -f docs/index.html ] && echo "Present" || echo "MISSING")"
            echo "Latest post detected: \${FILENAME:-None}"
            echo "pages build request: \$BUILD"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          for i in $(seq 1 16); do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" "$URL" || echo 000)
            [ "$CODE" = "200" ] && break
            sleep 15
          done
          
          if [ "$CODE" = "200" ]; then
            echo "### Web page is live ✅" >> "$GITHUB_STEP_SUMMARY"
            echo "$URL" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Web page not live yet ⏳ (HTTP $CODE)" >> "$GITHUB_STEP_SUMMARY"
            echo "URL checked: $URL"
            echo "Fix: Settings > Pages > Source 'Deploy from a branch' > branch main > folder /docs > Save." >> "$GITHUB_STEP_SUMMARY"
          fi
