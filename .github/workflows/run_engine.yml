name: run-engine

on:
  schedule:
    - cron: "0 */6 * * *"        # Runs every 6 hours
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (no real posts)"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write

concurrency:
  group: engine
  cancel-in-progress: false

jobs:
  run-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ffmpeg (optional video generation)
        if: ${{ vars.VIDEO_ENABLED == 'true' }}
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - run: pip install -r requirements.txt
      - run: mkdir -p assets generated_media docs docs/posts

      - name: Run engine
        run: python engine.py
        env:
          DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
          VIDEO_ENABLED: ${{ vars.VIDEO_ENABLED || 'false' }}
          TIKTOK_ENABLED: ${{ vars.TIKTOK_ENABLED || 'false' }}
          INSTAGRAM_ENABLED: ${{ vars.INSTAGRAM_ENABLED || 'false' }}
          TTS_ENGINE: ${{ vars.TTS_ENGINE || 'gtts' }}
          BRAND_NAME: ${{ vars.BRAND_NAME || 'Mamachi' }}
          DISABLE_PLATFORMS: ${{ vars.DISABLE_PLATFORMS || '' }}
          
          # Required Secrets
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SHORTIO_API_KEY: ${{ secrets.SHORTIO_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          
          # Optional Social Platforms
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
          MASTODON_INSTANCE: ${{ secrets.MASTODON_INSTANCE }}
          MASTODON_TOKEN: ${{ secrets.MASTODON_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_AUTHOR_URN: ${{ secrets.LINKEDIN_AUTHOR_URN }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
          DISCLAIMER: ${{ vars.DISCLAIMER || '' }}

      - name: Publish web feed (docs/)
        if: always()
        run: |
          git config user.name "mamachi-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs
          git diff --cached --quiet || (git commit -m "update web feed" && git push)

      - name: Trigger GitHub Pages build and check live status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p docs/posts
          
          if gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/builds" >/tmp/build.txt 2>&1; then BUILD="requested OK"; else BUILD="FAILED: $(head -c 300 /tmp/build.txt)"; fi
          git fetch origin "$GITHUB_REF_NAME" -q 2>/dev/null || true
          
          # Find the newest HTML post file generated in docs/posts/
          LATEST_POST=$(ls -t docs/posts/*.html 2>/dev/null | head -n 1)
          if [ -n "$LATEST_POST" ]; then
            FILENAME=$(basename "$LATEST_POST")
            IFS='/' read -r OWNER REPO <<< "$GITHUB_REPOSITORY"
            URL="https://${OWNER,,}.github.io/${REPO}/posts/${FILENAME}"
          else
            IFS='/' read -r OWNER REPO <<< "$GITHUB_REPOSITORY"
            URL="https://${OWNER,,}.github.io/${REPO}/"
          fi

          {
            echo "### Pages diagnostics"
            echo '```'
            echo "docs/index.html status: \$([ -f docs/index.html ] && echo "Present" || echo "MISSING")"
            echo "Latest post detected: \${FILENAME:-None}"
            echo "pages build request: \$BUILD"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          for i in $(seq 1 16); do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" "$URL" || echo 000)
            [ "$CODE" = "200" ] && break
            sleep 15
          done
          
          if [ "$CODE" = "200" ]; then
            echo "### Web page is live ✅" >> "$GITHUB_STEP_SUMMARY"
            echo "$URL" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Web page not live yet ⏳ (HTTP $CODE)" >> "$GITHUB_STEP_SUMMARY"
            echo "URL checked: $URL"
            echo "Fix: Settings > Pages > Source 'Deploy from a branch' > branch main > folder /docs > Save." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Keep generated media (TikTok/Instagram packages)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-media
          path: generated_media/
          if-no-files-found: ignore
          retention-days: 7
