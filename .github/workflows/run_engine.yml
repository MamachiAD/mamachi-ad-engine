name: Mamachi AD Engine Automation

on:
  # Automatic run every 6 hours
  schedule:
    - cron: '0 */6 * * *'

  # Manual trigger button
  workflow_dispatch:

jobs:
  run-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install system dependencies (FFmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create necessary folders
        run: mkdir -p assets generated_media

      - name: Run Mamachi Campaign Engine
        env:
          # Required
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SHORTIO_API_KEY: ${{ secrets.SHORTIO_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

          # Optional text social posts
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_AUTHOR_URN: ${{ secrets.LINKEDIN_AUTHOR_URN }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}

          # Free multi-media flags
          VIDEO_ENABLED: "true"
          YOUTUBE_ENABLED: "true"
          TIKTOK_ENABLED: "true"
          INSTAGRAM_ENABLED: "true"

          # Optional extras
          SHORTIO_DOMAIN: ${{ secrets.SHORTIO_DOMAIN }}
          DRY_RUN: "false"
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
          # FREE_MUSIC_PATH: assets/free_bg_music.mp3

        run: python engine.py

      - name: Upload generated media as artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-media-${{ github.run_id }}
          path: generated_media/
          retention-days: 14
          if-no-files-found: ignore
