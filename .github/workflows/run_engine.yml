name: run-engine
on:
  schedule:
    - cron: "0 */6 * * *"        # every 6 hours; change to taste
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (no real posts)"
        type: boolean
        default: false
permissions:
  contents: write
  pages: write
concurrency:
  group: engine
  cancel-in-progress: false
jobs:
  run-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install ffmpeg (only when video is on)
        if: ${{ vars.VIDEO_ENABLED == 'true' }}
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -r requirements.txt
      - run: mkdir -p assets generated_media docs
      - name: Run engine
        run: python engine.py
        env:
          DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
          # Non-secret switches: Settings > Secrets and variables > Actions > Variables
          VIDEO_ENABLED: ${{ vars.VIDEO_ENABLED || 'false' }}
          TIKTOK_ENABLED: ${{ vars.TIKTOK_ENABLED || 'false' }}
          INSTAGRAM_ENABLED: ${{ vars.INSTAGRAM_ENABLED || 'false' }}
          TTS_ENGINE: ${{ vars.TTS_ENGINE || 'gtts' }}
          BRAND_NAME: ${{ vars.BRAND_NAME || 'Mamachi' }}
          DISABLE_PLATFORMS: ${{ vars.DISABLE_PLATFORMS || '' }}
          # Required
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}        # service_role key
          SHORTIO_API_KEY: ${{ secrets.SHORTIO_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Optional platforms: leave unset until ready, each one switches on by itself
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
          MASTODON_INSTANCE: ${{ secrets.MASTODON_INSTANCE }}
          MASTODON_TOKEN: ${{ secrets.MASTODON_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_AUTHOR_URN: ${{ secrets.LINKEDIN_AUTHOR_URN }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
          DISCLAIMER: ${{ vars.DISCLAIMER || '' }}
      - name: Publish web feed (docs/)
        if: always()
        run: |
          git config user.name "mamachi-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs
          git diff --cached --quiet || (git commit -m "update web feed" && git push)
      - name: Trigger GitHub Pages build and check the page is live
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -f docs/posts.json ] || { echo "No docs/posts.json yet, nothing to check."; echo "### Web: docs/ was never created" >> "$GITHUB_STEP_SUMMARY"; exit 0; }
          # Pushes made with the built-in token may not start the Pages build by themselves, so ask for one.
          if gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/builds" >/tmp/build.txt 2>&1; then BUILD="requested OK"; else BUILD="FAILED: $(head -c 300 /tmp/build.txt)"; fi
          git fetch origin "$GITHUB_REF_NAME" -q 2>/dev/null || true
          {
            echo "### Pages diagnostics"
            echo '```'
            echo "docs/index.html committed on origin/$GITHUB_REF_NAME: $(git ls-tree -r --name-only FETCH_HEAD docs/index.html 2>/dev/null | wc -l)  (1 = yes, 0 = NO)"
            echo "last commit touching docs/: $(git log -1 --format='%h %ar' -- docs 2>/dev/null)"
            echo "pages build request: $BUILD"
            echo "repo private: $(gh api "repos/${GITHUB_REPOSITORY}" --jq .private 2>&1 | head -c 200)"
            echo "pages settings: $(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq '{status,html_url,build_type,source}' 2>&1 | head -c 400)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          URL=$(python3 -c "import json,os;p=json.load(open('docs/posts.json'))[0]['id'];o,r=os.environ['GITHUB_REPOSITORY'].split('/');print(f'https://{o.lower()}.github.io/{r}/posts/{p}.html')")
          for i in $(seq 1 16); do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" "$URL" || echo 000)
            [ "$CODE" = "200" ] && break
            sleep 15
          done
          if [ "$CODE" = "200" ]; then
            echo "### Web page is live ✅" >> "$GITHUB_STEP_SUMMARY"; echo "$URL" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Web page not live yet ⏳ (HTTP $CODE)" >> "$GITHUB_STEP_SUMMARY"
            echo "Fix: Settings > Pages > Source 'Deploy from a branch' > branch main > folder /docs > Save. Repo must be public on a free plan." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Keep generated media (TikTok/Instagram packages)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: generated-media
          path: generated_media/
          if-no-files-found: ignore
          retention-days: 7
